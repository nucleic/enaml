[package]
name = "enaml"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[lib]
name = "_rust"
crate-type = ["cdylib"]

[package.metadata.maturin]
module-name = "enaml._rust"
